org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Gradle daemon JDK: selected by gradle/gradle-daemon-jvm.properties (toolchainVersion=21).
# Do not hardcode org.gradle.java.home here; it only exists on one machine.
# In Android Studio, set Settings > Build Tools > Gradle > Gradle JDK instead.

# Allow Kotlin source sets for KSP-generated sources with AGP 8.9
android.disallowKotlinSourceSets=false
